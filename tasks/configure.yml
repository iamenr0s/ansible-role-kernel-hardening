---
- name: configure | Build the desired module list
  ansible.builtin.include_tasks: facts.yml

- name: configure | Ensure the modprobe.d directory exists
  ansible.builtin.file:
    path: "{{ linux_hardening_kernel_dropin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: configure | Write the drop-in
  ansible.builtin.template:
    src: modprobe.conf.j2
    dest: "{{ linux_hardening_kernel_dropin }}"
    owner: root
    group: root
    mode: "0644"
    backup: "{{ linux_hardening_backup | bool }}"
